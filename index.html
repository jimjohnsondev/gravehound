<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- viewport-fit=cover lets the game use the full screen on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Gravehound</title>
  </head>
  <body>
    <main id="app">
      <div id="screen-area">
        <canvas id="screen" width="320" height="192"></canvas>
      </div>
      <!-- On-screen controls. Shown on touch devices only (see style.css). -->
      <div id="touch-controls" aria-hidden="true">
        <div class="dpad" data-dpad>
          <div class="dpad-arm dpad-v"></div>
          <div class="dpad-arm dpad-h"></div>
        </div>
        <div class="buttons">
          <button class="btn btn-b" data-button="b">B</button>
          <button class="btn btn-a" data-button="a">A</button>
        </div>
        <button class="btn-menu" data-button="menu">MENU</button>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
